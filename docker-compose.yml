services:
  backend:
    build: .
    container_name: m12-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: m12-postgres
    environment:
      POSTGRES_DB: m12_analytics
      POSTGRES_USER: patricia
      POSTGRES_PASSWORD: patricia
    ports:
      - "5433:5432"
    volumes:
      - m12_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patricia -d m12_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  m12_postgres_data:
